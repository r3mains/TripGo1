<!-- Simple SVG icon for TripGo PWA -->
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="url(#bgGradient)"/>

  <!-- Car Icon -->
  <g transform="translate(48, 60)">
    <!-- Car body -->
    <rect x="16" y="32" width="64" height="24" rx="12" fill="white"/>
    <!-- Car roof -->
    <rect x="24" y="16" width="48" height="24" rx="8" fill="white" opacity="0.9"/>
    <!-- Wheels -->
    <circle cx="24" cy="64" r="8" fill="white"/>
    <circle cx="72" cy="64" r="8" fill="white"/>
    <!-- Headlight -->
    <circle cx="88" cy="44" r="3" fill="white"/>
  </g>

  <!-- Route line -->
  <path d="M 32 120 Q 96 140 160 120" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Location pin -->
  <g transform="translate(140, 100)">
    <path d="M 12 0 C 18.627 0 24 5.373 24 12 C 24 24 12 36 12 36 S 0 24 0 12 C 0 5.373 5.373 0 12 0 Z" fill="white"/>
    <circle cx="12" cy="12" r="6" fill="#667eea"/>
  </g>
</svg>
